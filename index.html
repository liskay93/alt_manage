<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>대체투자 약정 현황판</title>
<meta name="description" content="연도별 목표 약정 달성률과 연중 약정·집행·분배 추이를 한눈에 보는 대체투자 대시보드">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --page:#f3f5f8; --surface:#ffffff; --surface-2:#f6f7fa;
  --ink:#161b23; --ink-2:#4b5563; --muted:#7a8494;
  --grid:#e6e9ee; --axis:#c9cfd8; --border:rgba(22,27,35,.10);
  --accent:#2a78d6;
  --s-commit:#2a78d6; --s-call:#eb6834; --s-dist:#1baf7a; --s-prev:#b3b9c3;
  --track:#b7d3f6;
  --good:#006300; --bad:#c62828;
  --tip-bg:#161b23; --tip-ink:#ffffff; --tip-muted:#aab2bf;
  --shadow:0 1px 2px rgba(22,27,35,.05),0 10px 24px -14px rgba(22,27,35,.18);
  --radius:12px;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#0e1116; --surface:#171b22; --surface-2:#1d222a;
    --ink:#f3f5f8; --ink-2:#b5bcc7; --muted:#848c98;
    --grid:#272c35; --axis:#3a404b; --border:rgba(255,255,255,.10);
    --accent:#3987e5;
    --s-commit:#3987e5; --s-call:#d95926; --s-dist:#199e70; --s-prev:#4b525d;
    --track:#184f95;
    --good:#0ca30c; --bad:#e66767;
    --tip-bg:#f3f5f8; --tip-ink:#161b23; --tip-muted:#5c6470;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 24px -14px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0e1116; --surface:#171b22; --surface-2:#1d222a;
  --ink:#f3f5f8; --ink-2:#b5bcc7; --muted:#848c98;
  --grid:#272c35; --axis:#3a404b; --border:rgba(255,255,255,.10);
  --accent:#3987e5;
  --s-commit:#3987e5; --s-call:#d95926; --s-dist:#199e70; --s-prev:#4b525d;
  --track:#184f95;
  --good:#0ca30c; --bad:#e66767;
  --tip-bg:#f3f5f8; --tip-ink:#161b23; --tip-muted:#5c6470;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 24px -14px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{max-width:1280px;margin-inline:auto;padding-block:28px 56px;padding-inline:clamp(16px,3vw,32px)}
.masthead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px;margin-bottom:18px}
.eyebrow{margin:0 0 4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{margin:0;font-size:clamp(20px,2.4vw,26px);font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.meta{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.filters{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;margin-bottom:22px}
.filter{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.filter-label{font-size:12px;font-weight:600;color:var(--muted)}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:2px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px}
.seg button,.tools button{appearance:none;border:0;background:transparent;color:var(--ink-2);font:inherit;font-size:13px;font-weight:500;padding:5px 11px;border-radius:7px;cursor:pointer;font-variant-numeric:tabular-nums;line-height:1.3}
.seg button:hover,.tools button:hover{color:var(--ink)}
.seg button[aria-pressed="true"],.tools button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.10)}
.seg button:focus-visible,.tools button:focus-visible,tr[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.period{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;margin:0 0 10px}
.period h2{margin:0;font-size:13px;font-weight:600;color:var(--ink-2)}
.period span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px 12px;display:flex;flex-direction:column;gap:6px;min-height:124px;min-width:0}
.tile-label{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:7px}
.tile-label .key{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.tile-value{font-size:26px;font-weight:600;line-height:1.1;letter-spacing:-.01em;white-space:nowrap}
.tile-value .unit{font-size:14px;color:var(--ink-2);font-weight:500;margin-left:2px}
.tile-foot{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:auto;line-height:1.4}
.delta{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)} .delta.flat{color:var(--ink-2)}
.meter{height:6px;border-radius:3px;background:var(--track);overflow:hidden;flex:1 1 60px;min-width:40px}
.meter i{display:block;height:100%;background:var(--s-commit);border-radius:3px}
.spark{width:100%;height:28px;display:block}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.card{margin:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px 14px;box-shadow:var(--shadow);min-width:0}
.span-5{grid-column:span 5}.span-6{grid-column:span 6}.span-7{grid-column:span 7}.span-12{grid-column:span 12}
@media (max-width:920px){.span-5,.span-6,.span-7{grid-column:span 12}}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.card-head h2{margin:0;font-size:15px;font-weight:600}
.card-head .sub{margin:2px 0 0;font-size:12px;color:var(--muted)}
.tools{display:inline-flex;gap:2px;padding:2px;background:var(--surface-2);border-radius:7px;border:1px solid var(--border);flex:none}
.tools button{padding:3px 9px;font-size:12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2);margin-bottom:6px;min-height:18px}
.legend:empty{display:none}
.legend .item{display:inline-flex;align-items:center;gap:6px}
.legend .sw{width:12px;height:12px;border-radius:3px;flex:none}
.legend .sw.line{height:2.5px;width:14px;border-radius:1px}
.legend .sw.dash{height:0;width:14px;border-top:1.5px dashed var(--muted);border-radius:0}
.chart{position:relative;min-width:0}
.chart svg{display:block;width:100%;height:auto;font-family:var(--font);overflow:visible}
.chart text{fill:var(--ink-2);font-size:11px;font-variant-numeric:tabular-nums;pointer-events:none}
.chart path,.chart circle,.chart line{pointer-events:none}
.chart .tick{fill:var(--muted)}
.chart .gridline{stroke:var(--grid);stroke-width:1}
.chart .baseline{stroke:var(--axis);stroke-width:1}
.chart .crossline{stroke:var(--axis);stroke-width:1}
.chart .ref{stroke:var(--muted);stroke-dasharray:4 3;stroke-width:1}
.chart .hit{fill:transparent;cursor:pointer;outline:none;pointer-events:all}
.chart .hit.explore{cursor:crosshair}
.chart .hit:focus-visible{stroke:var(--accent);stroke-width:2}
.chart .bar-g:hover .mark,.chart .bar-g:focus-within .mark{filter:brightness(1.12)}
.chart .lbl{fill:var(--ink);font-weight:600;font-size:11.5px}
.chart .lbl.muted{fill:var(--muted);font-weight:500}
.chart .xlab{fill:var(--muted);text-anchor:middle}
.chart .xlab.sel{fill:var(--ink);font-weight:600}
.chart .xlab.sub{font-size:10.5px}
.chart .empty{fill:var(--muted);font-size:13px;text-anchor:middle}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--grid);white-space:nowrap;vertical-align:middle}
th{font-weight:600;color:var(--muted);font-size:12px}
th:first-child,td:first-child{text-align:left;padding-left:6px}
tbody tr[tabindex]{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
tbody tr.sel td:first-child{font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
tr.total td{font-weight:600;border-top:1px solid var(--axis);border-bottom:0}
td .meter{display:inline-block;vertical-align:middle;width:52px;margin-right:8px}
td.neg,.delta.neg{color:var(--bad)}
.tooltip{position:fixed;z-index:10;pointer-events:none;background:var(--tip-bg);color:var(--tip-ink);border-radius:8px;padding:8px 11px;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:280px;line-height:1.7}
.tooltip .t{color:var(--tip-muted);margin-bottom:2px;font-weight:600}
.tooltip .r{display:flex;align-items:center;gap:8px}
.tooltip .r .k{width:12px;height:3px;border-radius:2px;flex:none}
.tooltip .r .k.rect{height:10px;border-radius:2px}
.tooltip .r .k.none{background:transparent}
.tooltip .r .n{color:var(--tip-muted)}
.tooltip .r .v{font-weight:600;font-variant-numeric:tabular-nums;margin-left:auto;padding-left:12px}
.tooltip .r.strong .n{color:var(--tip-ink)}
footer{margin-top:24px;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px}
.empty-page{padding:40px 0;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.tooltip{display:none}.card{box-shadow:none;break-inside:avoid}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="masthead">
    <div>
      <p class="eyebrow">대체투자 · 약정 관리</p>
      <h1>대체투자 약정 현황판</h1>
    </div>
    <div class="meta" id="meta"></div>
  </header>

  <div class="filters" role="group" aria-label="조회 조건">
    <div class="filter"><span class="filter-label">기준연도</span><div class="seg" id="yearSeg" role="group" aria-label="기준연도"></div></div>
    <div class="filter"><span class="filter-label">자산군</span><div class="seg" id="classSeg" role="group" aria-label="자산군"></div></div>
  </div>

  <div class="period"><h2 id="periodTitle"></h2><span id="periodNote"></span></div>
  <section class="kpis" id="kpis" aria-label="핵심 지표"></section>

  <section class="grid">
    <figure class="card span-5" data-card="yearly">
      <figcaption class="card-head">
        <div><h2>연도별 목표 약정 달성</h2><p class="sub">연한 막대는 목표, 진한 막대는 신규 약정 · 막대를 누르면 기준연도가 바뀝니다</p></div>
        <div class="tools"><button type="button" data-view="chart" aria-pressed="true">차트</button><button type="button" data-view="table" aria-pressed="false">표</button></div>
      </figcaption>
      <div class="legend"></div>
      <div class="chart"></div>
      <div class="table-wrap" hidden></div>
    </figure>

    <figure class="card span-7" data-card="cum">
      <figcaption class="card-head">
        <div><h2>연중 누적 추이</h2><p class="sub">1월부터 누적한 약정·집행·분배와 연간 목표 약정</p></div>
        <div class="tools"><button type="button" data-view="chart" aria-pressed="true">차트</button><button type="button" data-view="table" aria-pressed="false">표</button></div>
      </figcaption>
      <div class="legend"></div>
      <div class="chart"></div>
      <div class="table-wrap" hidden></div>
    </figure>

    <figure class="card span-6" data-card="flow">
      <figcaption class="card-head">
        <div><h2>월별 집행·분배</h2><p class="sub">위는 펀드로부터 받은 분배, 아래는 캐피털콜에 응한 집행</p></div>
        <div class="tools"><button type="button" data-view="chart" aria-pressed="true">차트</button><button type="button" data-view="table" aria-pressed="false">표</button></div>
      </figcaption>
      <div class="legend"></div>
      <div class="chart"></div>
      <div class="table-wrap" hidden></div>
    </figure>

    <figure class="card span-6" data-card="byClass">
      <figcaption class="card-head">
        <div><h2>자산군별 현황</h2><p class="sub">행을 누르면 해당 자산군으로 조회합니다</p></div>
      </figcaption>
      <div class="table-wrap"></div>
    </figure>
  </section>

  <footer id="foot"></footer>
</div>
<div class="tooltip" id="tooltip" role="tooltip" hidden></div>

<script src="data/data.js"></script>
<script>
(function () {
  'use strict';
  const D = window.ALT_DATA;
  const $ = (sel, root) => (root || document).querySelector(sel);

  if (!D || !Array.isArray(D.flows) || !Array.isArray(D.targets)) {
    document.getElementById('app').replaceChildren(
      el('p', { class: 'empty-page', text: '데이터 파일(data/data.js)을 찾을 수 없습니다. scripts/build.py 를 실행해 주세요.' }));
    return;
  }

  // ---------- 기본 정보 ----------
  const UNIT = D.unit || '억원';
  const U = UNIT.endsWith('원') ? UNIT.slice(0, -1) : UNIT;
  const asOf = parseDate(D.asOf);
  const asOfY = asOf.getFullYear(), asOfM = asOf.getMonth() + 1;
  const CLASSES = (D.assetClasses || []).slice();
  const YEARS = [...new Set(D.targets.map(t => +t.year))].sort((a, b) => a - b);
  const ALL = '전체';

  const flowMap = new Map();
  const yearsWithFlows = new Set();
  for (const f of D.flows) {
    flowMap.set(f.month + '|' + f.assetClass, f);
    yearsWithFlows.add(+f.month.slice(0, 4));
  }

  // ---------- 상태 (기준연도 · 자산군 · 카드별 보기) ----------
  const KEY = 'alt-dashboard-state';
  function loadState() { try { const s = JSON.parse(localStorage.getItem(KEY)); return s && typeof s === 'object' ? s : null; } catch (e) { return null; } }
  function saveState() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* 저장 불가 환경 */ } }
  const saved = loadState() || {};
  const state = {
    year: YEARS.includes(saved.year) ? saved.year : (YEARS.includes(asOfY) ? asOfY : YEARS[YEARS.length - 1]),
    cls: (saved.cls === ALL || CLASSES.includes(saved.cls)) ? saved.cls : ALL,
    views: (saved.views && typeof saved.views === 'object') ? saved.views : {},
  };

  // ---------- 집계 ----------
  function parseDate(s) { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date(); }
  function lastMonth(year) { return year < asOfY ? 12 : year === asOfY ? asOfM : 0; }
  function cellSum(year, m, cls) {
    const ym = year + '-' + String(m).padStart(2, '0');
    const list = cls === ALL ? CLASSES : [cls];
    const out = { commit: 0, call: 0, dist: 0, n: 0 };
    for (const c of list) {
      const f = flowMap.get(ym + '|' + c);
      if (!f) continue;
      out.commit += +f.commitment || 0; out.call += +f.drawdown || 0; out.dist += +f.distribution || 0; out.n += +f.commitCount || 0;
    }
    return out;
  }
  function monthly(year, cls) { const L = lastMonth(year); return Array.from({ length: 12 }, (_, i) => i < L ? cellSum(year, i + 1, cls) : null); }
  function cumulative(arr) {
    let c = { commit: 0, call: 0, dist: 0, n: 0 };
    return arr.map(v => v ? (c = { commit: c.commit + v.commit, call: c.call + v.call, dist: c.dist + v.dist, n: c.n + v.n }) : null);
  }
  function targetFor(year, cls) { return D.targets.filter(t => +t.year === year && (cls === ALL || t.assetClass === cls)).reduce((s, t) => s + (+t.target || 0), 0); }
  function periodOf(year) { const L = lastMonth(year); return L >= 12 ? '1~12월' : L > 0 ? '1~' + L + '월' : '데이터 없음'; }

  // ---------- 서식 ----------
  const nf = new Intl.NumberFormat('ko-KR', { maximumFractionDigits: 0 });
  function fmt(v) { return (v == null || isNaN(v)) ? '–' : nf.format(Math.round(v)); }
  function fmtU(v) { return (v == null || isNaN(v)) ? '–' : fmt(v) + U; }
  function fmtSigned(v) { if (v == null || isNaN(v)) return '–'; const r = Math.round(v); return (r > 0 ? '+' : r < 0 ? '−' : '') + fmt(Math.abs(r)); }
  function fmtPct(v, d) { return (v == null || !isFinite(v)) ? '–' : (v * 100).toFixed(d || 0) + '%'; }

  // ---------- DOM 도우미 ----------
  const NS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs, children) {
    const e = document.createElement(tag);
    if (attrs) for (const k in attrs) { if (k === 'class') e.className = attrs[k]; else if (k === 'text') e.textContent = attrs[k]; else if (attrs[k] != null) e.setAttribute(k, attrs[k]); }
    if (children) for (const c of children) if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    return e;
  }
  function svg(tag, attrs, children) {
    const e = document.createElementNS(NS, tag);
    if (attrs) for (const k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]);
    if (children) for (const c of children) if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    return e;
  }
  function barPath(x, y, w, h, r, dir) {
    if (h <= 0) return '';
    r = Math.min(r, w / 2, h);
    if (dir === 'down') return 'M' + x + ',' + y + ' V' + (y + h - r) + ' Q' + x + ',' + (y + h) + ' ' + (x + r) + ',' + (y + h) + ' H' + (x + w - r) + ' Q' + (x + w) + ',' + (y + h) + ' ' + (x + w) + ',' + (y + h - r) + ' V' + y + ' Z';
    return 'M' + x + ',' + (y + h) + ' V' + (y + r) + ' Q' + x + ',' + y + ' ' + (x + r) + ',' + y + ' H' + (x + w - r) + ' Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) + ' V' + (y + h) + ' Z';
  }
  function niceTicks(max, count) {
    max = Math.max(max, 1); count = count || 4;
    const raw = max / count, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
    const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
    const ticks = [];
    for (let v = 0; v < max + step * 0.999 && ticks.length < 20; v += step) ticks.push(Math.round(v * 1e6) / 1e6);
    if (ticks[ticks.length - 1] < max) ticks.push(Math.round((ticks[ticks.length - 1] + step) * 1e6) / 1e6);
    return ticks;
  }
  function resolveLabels(labels, gap, minY, maxY) {
    labels.sort((a, b) => a.y - b.y);
    for (let i = 1; i < labels.length; i++) if (labels[i].y - labels[i - 1].y < gap) labels[i].y = labels[i - 1].y + gap;
    if (labels.length && labels[labels.length - 1].y > maxY) { const d = labels[labels.length - 1].y - maxY; for (const l of labels) l.y -= d; }
    for (let i = labels.length - 2; i >= 0; i--) if (labels[i + 1].y - labels[i].y < gap) labels[i].y = labels[i + 1].y - gap;
    if (labels.length && labels[0].y < minY) { const d = minY - labels[0].y; for (const l of labels) l.y += d; }
  }
  function legendInto(host, items) {
    host.replaceChildren(...items.map(it => {
      const sw = el('span', { class: 'sw ' + (it.shape || 'rect') });
      if (it.color) sw.style.background = it.color;
      return el('span', { class: 'item' }, [sw, el('span', { text: it.label })]);
    }));
  }
  function table(headers, rows, opts) {
    opts = opts || {};
    const t = el('table');
    if (opts.caption) t.appendChild(el('caption', { class: 'sr-only', text: opts.caption }));
    t.appendChild(el('thead', null, [el('tr', null, headers.map(h => el('th', { scope: 'col', text: h })))]));
    const tb = el('tbody');
    rows.forEach((r, i) => {

  // ---------- 툴팁 ----------

  // ---------- 상단: 기준 정보 · 필터 ----------
  function renderHeader() {

  function seg(host, items, current, onPick) {

  // ---------- 핵심 지표 ----------
  function spark(vals, color) {
    const w = 120, h = 28, n = vals.length, gap = 2, bw = (w - gap * (n - 1)) / n;
    const max = Math.max(1, ...vals.map(v => v == null ? 0 : v));
    let last = -1; vals.forEach((v, i) => { if (v != null) last = i; });
    const s = svg('svg', { viewBox: '0 0 ' + w + ' ' + h, class: 'spark', 'aria-hidden': 'true', preserveAspectRatio: 'none' });
    vals.forEach((v, i) => {
      if (v == null) return;
      const bh = Math.max(1.5, (v / max) * (h - 2));
      s.appendChild(svg('rect', { x: i * (bw + gap), y: h - bh, width: bw, height: bh, fill: i === last ? color : 'var(--s-prev)' }));
    });
    return s;
  }
  function deltaEl(cur, prev, colored) {
    if (prev == null) return el('span', { class: 'delta flat', text: '전년 동기 자료 없음' });
    if (!prev) return el('span', { class: 'delta flat', text: cur ? '전년 동기 0' : '변동 없음' });
    const r = cur / prev - 1, dir = r > 0.0005 ? 'up' : r < -0.0005 ? 'down' : 'flat';
    const arrow = dir === 'up' ? '▲' : dir === 'down' ? '▼' : '■';
    return el('span', { class: 'delta ' + (colored ? dir : 'flat'), text: arrow + ' ' + Math.abs(r * 100).toFixed(1) + '%', 'aria-label': (dir === 'up' ? '증가 ' : dir === 'down' ? '감소 ' : '보합 ') + Math.abs(r * 100).toFixed(1) + '%' });
  }
  function tile(o) {
    const lab = el('div', { class: 'tile-label' });
    if (o.color) { const k = el('span', { class: 'key' }); k.style.background = o.color; lab.appendChild(k); }
    lab.appendChild(el('span', { text: o.label }));
    const val = el('div', { class: 'tile-value' }, [o.value, el('span', { class: 'unit', text: o.unit == null ? U : o.unit })]);
    const t = el('div', { class: 'tile' }, [lab, val]);
    if (o.spark) t.appendChild(o.spark);
    if (o.foot) t.appendChild(el('div', { class: 'tile-foot' }, o.foot));
    return t;
  }
  function renderKpis() {
    const y = state.year, cls = state.cls, L = lastMonth(y);
    const mon = monthly(y, cls), cum = cumulative(mon);
    const now = (L > 0 && cum[L - 1]) || { commit: 0, call: 0, dist: 0, n: 0 };
    const target = targetFor(y, cls);
    const hasPrev = yearsWithFlows.has(y - 1);
    const pcum = hasPrev ? cumulative(monthly(y - 1, cls)) : null;
    const prev = (pcum && L > 0 && pcum[L - 1]) || (hasPrev ? { commit: 0, call: 0, dist: 0 } : null);
    const ratio = target > 0 ? now.commit / target : null;
    const meter = el('span', { class: 'meter', role: 'img', 'aria-label': '목표 달성률 ' + fmtPct(ratio) }, [el('i')]);
    meter.firstChild.style.width = (ratio == null ? 0 : Math.min(100, ratio * 100)) + '%';
    const net = now.dist - now.call;
    const netVal = fmtSigned(net);
    const tiles = [
      tile({ label: '연간 목표 약정', value: target > 0 ? fmt(target) : '–', unit: target > 0 ? U : '', foot: [el('span', { text: (cls === ALL ? CLASSES.length + '개 자산군 합계' : cls + ' 목표') + ' · ' + y + '년' })] }),
      tile({ label: '신규 약정', color: 'var(--s-commit)', value: fmt(now.commit), foot: [meter, el('span', { class: 'delta flat', text: '목표 대비 ' + fmtPct(ratio) })] }),
      tile({ label: '집행 (캐피털콜)', color: 'var(--s-call)', value: fmt(now.call), spark: spark(mon.map(v => v && v.call), 'var(--s-call)'), foot: [deltaEl(now.call, prev && prev.call, false), el('span', { text: '전년 동기 대비' })] }),
      tile({ label: '분배 (회수)', color: 'var(--s-dist)', value: fmt(now.dist), spark: spark(mon.map(v => v && v.dist), 'var(--s-dist)'), foot: [deltaEl(now.dist, prev && prev.dist, true), el('span', { text: '전년 동기 대비' })] }),
      tile({ label: '순현금흐름', value: netVal, foot: [el('span', { class: 'delta ' + (net < 0 ? 'neg' : 'flat'), text: net >= 0 ? '순유입' : '순유출' }), el('span', { text: '분배 − 집행 · 신규 약정 ' + now.n + '건' })] }),
    ];
    if (net < 0) tiles[4].querySelector('.tile-value').classList.add('neg');
    $('#kpis').replaceChildren(...tiles);
    // 신규 약정 타일에도 전년 동기 비교를 붙인다
    tiles[1].querySelector('.tile-foot').append(deltaEl(now.commit, prev && prev.commit, true), el('span', { text: '전년 동기 대비' }));
  }

  // ---------- 카드 공통 ----------
  function cardParts(id) { const card = $('[data-card="' + id + '"]'); return { card, chart: $('.chart', card), tableWrap: $('.table-wrap', card), legend: $('.legend', card) }; }
  function applyView(id) {
    const { card, chart, tableWrap } = cardParts(id);
    const view = state.views[id] === 'table' ? 'table' : 'chart';
    if (chart) chart.hidden = view !== 'chart';
    if (tableWrap) tableWrap.hidden = view !== 'table' && !!chart;

  }
  document.querySelectorAll('.tools button').forEach(b => b.addEventListener('click', () => {
    const id = b.closest('[data-card]').dataset.card;
    state.views[id] = b.dataset.view; saveState(); applyView(id);
  }));

  // ---------- 차트 1: 연도별 목표 약정 달성 ----------
  function yearlyRows() {
    return YEARS.map(y => {
      const L = lastMonth(y), cum = cumulative(monthly(y, state.cls));
      const actual = L > 0 && cum[L - 1] ? cum[L - 1].commit : 0, target = targetFor(y, state.cls);
      return { year: y, target, actual, ratio: target > 0 ? actual / target : null, months: L };
    });
  }
  function renderYearly() {
    const { chart: host, tableWrap, legend } = cardParts('yearly');
    const rows = yearlyRows();
    legendInto(legend, [{ label: '목표 약정', color: 'var(--track)' }, { label: '신규 약정', color: 'var(--s-commit)' }]);
    const W = Math.max(280, host.clientWidth || 560), H = 300;
    const m = { t: 30, r: 12, b: 50, l: 52 }, pw = W - m.l - m.r, ph = H - m.t - m.b;
    const ticks = niceTicks(Math.max(1, ...rows.map(r => Math.max(r.target, r.actual))), 4), top = ticks[ticks.length - 1];
    const y = v => m.t + ph - (v / top) * ph, y0 = y(0);
    const band = pw / rows.length, bw = Math.min(24, Math.max(8, band * 0.42));
    const s = svg('svg', { viewBox: '0 0 ' + W + ' ' + H, width: W, height: H, role: 'group', 'aria-label': '연도별 목표 약정 대비 신규 약정' });
    for (const t of ticks) {
      s.appendChild(svg('line', { x1: m.l, x2: W - m.r, y1: y(t), y2: y(t), class: t === 0 ? 'baseline' : 'gridline' }));
      s.appendChild(svg('text', { x: m.l - 8, y: y(t) + 4, 'text-anchor': 'end', class: 'tick' }, [fmt(t)]));
    }
    rows.forEach((r, i) => {
      const cx = m.l + band * (i + 0.5), x = cx - bw / 2, sel = r.year === state.year;
      const g = svg('g', { class: 'bar-g' + (sel ? ' sel' : '') });
      const partial = r.year === asOfY && r.months < 12;
      const hit = svg('rect', { x: m.l + band * i, y: m.t - 20, width: band, height: ph + 20 + m.b - 6, class: 'hit', tabindex: 0, role: 'button', 'aria-pressed': String(sel), 'aria-label': r.year + '년 목표 ' + fmtU(r.target) + ', 신규 약정 ' + fmtU(r.actual) + ', 달성률 ' + fmtPct(r.ratio) + '. 기준연도로 선택' });
      g.appendChild(hit);
      if (r.target > 0) g.appendChild(svg('path', { d: barPath(x, y(r.target), bw, y0 - y(r.target), 4, 'up'), fill: 'var(--track)', class: 'track' }));
      if (r.actual > 0) g.appendChild(svg('path', { d: barPath(x, y(r.actual), bw, y0 - y(r.actual), 4, 'up'), fill: 'var(--s-commit)', class: 'mark' }));
      const topV = Math.max(r.target, r.actual);
      if (r.ratio != null) g.appendChild(svg('text', { x: cx, y: y(topV) - 7, 'text-anchor': 'middle', class: 'lbl' }, [fmtPct(r.ratio)]));
      else if (r.actual > 0) g.appendChild(svg('text', { x: cx, y: y(topV) - 7, 'text-anchor': 'middle', class: 'lbl muted' }, [fmt(r.actual)]));
      g.appendChild(svg('text', { x: cx, y: H - m.b + 18, class: 'xlab' + (sel ? ' sel' : '') }, [String(r.year) + (partial ? '(' + r.months + '월)' : '')]));
      if (band >= 58) g.appendChild(svg('text', { x: cx, y: H - m.b + 33, class: 'xlab sub' }, [r.target > 0 ? '목표 ' + fmt(r.target) : '목표 없음']));
      if (sel) g.appendChild(svg('rect', { x: cx - 14, y: H - m.b + 39, width: 28, height: 2, rx: 1, fill: 'var(--accent)' }));
      const rowsTip = () => [
        { color: 'var(--track)', shape: 'rect', label: '목표 약정', value: fmtU(r.target) },
        { color: 'var(--s-commit)', shape: 'rect', label: partial ? '신규 약정 (1~' + r.months + '월)' : '신규 약정', value: fmtU(r.actual) },
        { label: '달성률', value: fmtPct(r.ratio), strong: true },
      ];
      hit.addEventListener('pointerenter', e => showTip(r.year + '년', rowsTip(), e.clientX, e.clientY));
      hit.addEventListener('pointermove', e => positionTip(e.clientX, e.clientY));
      hit.addEventListener('pointerleave', hideTip);

      hit.addEventListener('blur', hideTip);
      const select = () => { if (state.year !== r.year) { state.year = r.year; saveState(); hideTip(); renderAll(); } };
      hit.addEventListener('click', select);
      hit.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(); } });

      rows.map(r => [r.year + '년' + (r.year === asOfY && r.months < 12 ? ' (1~' + r.months + '월)' : ''), fmt(r.target), fmt(r.actual), fmtPct(r.ratio)]),
      { rowClass: r => (r[0].startsWith(String(state.year)) ? 'sel' : '') }));

  // ---------- 차트 2: 연중 누적 추이 ----------
  function renderCum() {
    const { chart: host, tableWrap, legend } = cardParts('cum');
    const yv = state.year, cls = state.cls;
    const cur = cumulative(monthly(yv, cls));
    const hasPrev = yearsWithFlows.has(yv - 1);
    const prev = hasPrev ? cumulative(monthly(yv - 1, cls)) : null;
    const target = targetFor(yv, cls);
    const series = [
      { key: 'commit', label: '약정 누적', color: 'var(--s-commit)', vals: cur.map(v => v ? v.commit : null) },
      { key: 'call', label: '집행 누적', color: 'var(--s-call)', vals: cur.map(v => v ? v.call : null) },
      { key: 'dist', label: '분배 누적', color: 'var(--s-dist)', vals: cur.map(v => v ? v.dist : null) },
    ];
    if (prev) series.push({ key: 'prev', label: (yv - 1) + '년 약정 누적', color: 'var(--s-prev)', vals: prev.map(v => v ? v.commit : null), context: true });
    legendInto(legend, [...series.map(sr => ({ label: sr.label, color: sr.color, shape: 'line' })), target > 0 ? { label: '연간 목표 약정', shape: 'dash' } : null].filter(Boolean));

    const W = Math.max(320, host.clientWidth || 700), H = 320, narrow = W < 520;
    const m = { t: 18, r: narrow ? 64 : 108, b: 30, l: 52 }, pw = W - m.l - m.r, ph = H - m.t - m.b;
    const allVals = series.flatMap(sr => sr.vals.filter(v => v != null));
    const ticks = niceTicks(Math.max(1, target, ...allVals), 4), top = ticks[ticks.length - 1];
    const y = v => m.t + ph - (v / top) * ph, x = i => m.l + (pw / 11) * i;
    const s = svg('svg', { viewBox: '0 0 ' + W + ' ' + H, width: W, height: H, role: 'group', 'aria-label': yv + '년 연중 누적 약정·집행·분배 추이' });
    for (const t of ticks) {
      s.appendChild(svg('line', { x1: m.l, x2: m.l + pw, y1: y(t), y2: y(t), class: t === 0 ? 'baseline' : 'gridline' }));
      s.appendChild(svg('text', { x: m.l - 8, y: y(t) + 4, 'text-anchor': 'end', class: 'tick' }, [fmt(t)]));
    }
    for (let i = 0; i < 12; i++) { if (narrow && i % 2) continue; s.appendChild(svg('text', { x: x(i), y: H - m.b + 18, class: 'xlab' }, [(i + 1) + '월'])); }
    if (target > 0) s.appendChild(svg('line', { x1: m.l, x2: m.l + pw, y1: y(target), y2: y(target), class: 'ref' }));
    const labels = [];
    if (target > 0) labels.push({ y: y(target), py: y(target), px: m.l + pw, text: (narrow ? '' : '목표 ') + fmt(target), cls: 'lbl muted' });
    if (!allVals.length) s.appendChild(svg('text', { x: m.l + pw / 2, y: m.t + ph / 2, class: 'empty' }, ['해당 기간 데이터가 없습니다']));
    for (const sr of series) {
      let d = '', li = -1;
      sr.vals.forEach((v, i) => { if (v == null) return; d += (li < 0 ? 'M' : 'L') + x(i).toFixed(1) + ',' + y(v).toFixed(1); li = i; });
      sr.last = li;
      if (li < 0) continue;
      s.appendChild(svg('path', { d, fill: 'none', stroke: sr.color, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
      if (!sr.context) {
        s.appendChild(svg('circle', { cx: x(li), cy: y(sr.vals[li]), r: 4.5, fill: sr.color, stroke: 'var(--surface)', 'stroke-width': 2 }));
        labels.push({ y: y(sr.vals[li]), py: y(sr.vals[li]), px: x(li), text: fmt(sr.vals[li]), cls: 'lbl' });
      }
    }
    resolveLabels(labels, 15, m.t + 4, m.t + ph);
    const lx = m.l + pw + 10;
    for (const L of labels) {
      if (Math.abs(L.y - L.py) > 2 || L.px < m.l + pw - 1) s.appendChild(svg('line', { x1: L.px + 6, y1: L.py, x2: lx - 3, y2: L.y, stroke: 'var(--axis)', 'stroke-width': 1 }));
      s.appendChild(svg('text', { x: lx, y: L.y + 4, class: L.cls }, [L.text]));
    }
    // 크로스헤어 + 툴팁
    const cross = svg('g', { visibility: 'hidden' });
    const cl = svg('line', { y1: m.t, y2: m.t + ph, class: 'crossline' });
    cross.appendChild(cl);
    const dots = series.map(sr => { const c = svg('circle', { r: 4, fill: sr.color, stroke: 'var(--surface)', 'stroke-width': 2 }); cross.appendChild(c); return c; });
    s.appendChild(cross);
    const overlay = svg('rect', { x: m.l, y: m.t, width: pw, height: ph, class: 'hit explore', tabindex: 0, role: 'application', 'aria-label': '월별 값 탐색. 좌우 화살표로 이동' });
    s.appendChild(overlay);

    const hide = () => { ci = -1; cross.setAttribute('visibility', 'hidden'); hideTip(); };
    function showAt(i, cx, cy) {
      ci = i;
      const rows = [];
      series.forEach((sr, k) => {
        const v = sr.vals[i];
        if (v == null) { dots[k].setAttribute('visibility', 'hidden'); return; }
        dots[k].removeAttribute('visibility'); dots[k].setAttribute('cx', x(i)); dots[k].setAttribute('cy', y(v));
        rows.push({ color: sr.color, shape: 'line', label: sr.label, value: fmtU(v) });
      });
      if (!rows.length) { hide(); return; }
      if (target > 0 && series[0].vals[i] != null) rows.push({ label: '목표 대비 약정', value: fmtPct(series[0].vals[i] / target), strong: true });
      cl.setAttribute('x1', x(i)); cl.setAttribute('x2', x(i)); cross.removeAttribute('visibility');
      showTip(yv + '년 ' + (i + 1) + '월 누적', rows, cx, cy);
    }
    overlay.addEventListener('pointermove', e => {
      const r = s.getBoundingClientRect(), sx = (e.clientX - r.left) * (W / r.width);
      const i = Math.max(0, Math.min(11, Math.round((sx - m.l) / (pw / 11))));
      if (i !== ci) showAt(i, e.clientX, e.clientY); else positionTip(e.clientX, e.clientY);
    });
    overlay.addEventListener('pointerleave', hide);
    overlay.addEventListener('focus', () => { if (lastIdx >= 0) { const p = svgPoint(s, W, H, x(lastIdx), m.t + 10); showAt(lastIdx, p[0], p[1]); } });
    overlay.addEventListener('blur', hide);
    overlay.addEventListener('keydown', e => {

      const p = svgPoint(s, W, H, x(i), m.t + 10); showAt(i, p[0], p[1]);
    });
    host.replaceChildren(s);
    tableWrap.replaceChildren(table(['월', ...series.map(sr => sr.label + ' (' + U + ')'), ...(target > 0 ? ['목표 대비 약정'] : [])],
      Array.from({ length: 12 }, (_, i) => [(i + 1) + '월', ...series.map(sr => fmt(sr.vals[i])), ...(target > 0 ? [series[0].vals[i] == null ? '–' : fmtPct(series[0].vals[i] / target)] : [])])));
    applyView('cum');
  }

  // ---------- 차트 3: 월별 집행·분배 ----------
  function renderFlow() {
    const { chart: host, tableWrap, legend } = cardParts('flow');
    const yv = state.year, cls = state.cls, mon = monthly(yv, cls);
    legendInto(legend, [{ label: '분배 (유입)', color: 'var(--s-dist)' }, { label: '집행 (유출)', color: 'var(--s-call)' }]);
    const W = Math.max(320, host.clientWidth || 700), H = 280, narrow = W < 520;
    const m = { t: 18, r: 12, b: 30, l: 52 }, pw = W - m.l - m.r, ph = H - m.t - m.b;
    const maxD = Math.max(0, ...mon.map(v => v ? v.dist : 0)), maxC = Math.max(0, ...mon.map(v => v ? v.call : 0));
    const tPos = niceTicks(Math.max(maxD, 1), 3), tNeg = niceTicks(Math.max(maxC, 1), 3);
    const top = tPos[tPos.length - 1], bot = tNeg[tNeg.length - 1];
    const y = v => m.t + ((top - v) / (top + bot)) * ph, y0 = y(0);
    const band = pw / 12, bw = Math.min(24, Math.max(6, band * 0.5));
    const s = svg('svg', { viewBox: '0 0 ' + W + ' ' + H, width: W, height: H, role: 'group', 'aria-label': yv + '년 월별 집행과 분배' });
    const gridAt = (v, label) => {
      s.appendChild(svg('line', { x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), class: v === 0 ? 'baseline' : 'gridline' }));
      s.appendChild(svg('text', { x: m.l - 8, y: y(v) + 4, 'text-anchor': 'end', class: 'tick' }, [label]));
    };
    for (const t of tPos) gridAt(t, fmt(t));
    for (const t of tNeg) if (t > 0) gridAt(-t, '−' + fmt(t));
    if (!mon.some(Boolean)) s.appendChild(svg('text', { x: m.l + pw / 2, y: m.t + ph / 2, class: 'empty' }, ['해당 기간 데이터가 없습니다']));
    mon.forEach((v, i) => {
      const cx = m.l + band * (i + 0.5), x = cx - bw / 2;
      if (!narrow || i % 2 === 0) s.appendChild(svg('text', { x: cx, y: H - m.b + 18, class: 'xlab' }, [(i + 1) + '월']));
      if (!v) return;
      const g = svg('g', { class: 'bar-g' });
      const net = v.dist - v.call;
      const hit = svg('rect', { x: m.l + band * i, y: m.t, width: band, height: ph, class: 'hit', tabindex: 0, 'aria-label': yv + '년 ' + (i + 1) + '월 분배 ' + fmtU(v.dist) + ', 집행 ' + fmtU(v.call) + ', 순현금흐름 ' + fmtSigned(net) + U });
      g.appendChild(hit);
      if (v.dist > 0) g.appendChild(svg('path', { d: barPath(x, y(v.dist), bw, y0 - 1 - y(v.dist), 4, 'up'), fill: 'var(--s-dist)', class: 'mark' }));
      if (v.call > 0) g.appendChild(svg('path', { d: barPath(x, y0 + 1, bw, y(-v.call) - y0 - 1, 4, 'down'), fill: 'var(--s-call)', class: 'mark' }));
      const rows = [
        { color: 'var(--s-dist)', shape: 'rect', label: '분배', value: '+' + fmt(v.dist) + U },
        { color: 'var(--s-call)', shape: 'rect', label: '집행', value: '−' + fmt(v.call) + U },
        { label: '순현금흐름', value: fmtSigned(net) + U, strong: true },
      ];
      const title = yv + '년 ' + (i + 1) + '월';
      hit.addEventListener('pointerenter', e => showTip(title, rows, e.clientX, e.clientY));
      hit.addEventListener('pointermove', e => positionTip(e.clientX, e.clientY));
      hit.addEventListener('pointerleave', hideTip);
      hit.addEventListener('focus', () => { const p = svgPoint(s, W, H, cx, y(v.dist)); showTip(title, rows, p[0], p[1]); });
      hit.addEventListener('blur', hideTip);
      s.appendChild(g);
    });
    host.replaceChildren(s);
    const tRows = mon.map((v, i) => [(i + 1) + '월', v ? fmt(v.dist) : '–', v ? fmt(v.call) : '–', v ? fmtSigned(v.dist - v.call) : '–']);
    const tot = mon.reduce((a, v) => v ? { d: a.d + v.dist, c: a.c + v.call } : a, { d: 0, c: 0 });
    tRows.push(['합계', fmt(tot.d), fmt(tot.c), fmtSigned(tot.d - tot.c)]);
    tableWrap.replaceChildren(table(['월', '분배 (' + U + ')', '집행 (' + U + ')', '순현금흐름 (' + U + ')'], tRows, { totalLast: true }));
    applyView('flow');
  }

  // ---------- 표: 자산군별 현황 ----------
  function renderByClass() {
    const { tableWrap } = cardParts('byClass');
    const yv = state.year, L = lastMonth(yv);
    const rows = CLASSES.map(c => {
      const cum = cumulative(monthly(yv, c));
      const now = (L > 0 && cum[L - 1]) || { commit: 0, call: 0, dist: 0, n: 0 };
      const target = targetFor(yv, c);
      return { name: c, target, ...now, ratio: target > 0 ? now.commit / target : null };
    });
    const tot = rows.reduce((a, r) => ({ name: '합계', target: a.target + r.target, commit: a.commit + r.commit, call: a.call + r.call, dist: a.dist + r.dist, n: a.n + r.n }), { target: 0, commit: 0, call: 0, dist: 0, n: 0 });
    tot.ratio = tot.target > 0 ? tot.commit / tot.target : null;
    const all = [...rows, tot];
    const meterCell = r => {
      const wrap = el('span', null);
      const mtr = el('span', { class: 'meter', 'aria-hidden': 'true' }, [el('i')]);
      mtr.firstChild.style.width = (r.ratio == null ? 0 : Math.min(100, r.ratio * 100)) + '%';
      wrap.append(mtr, fmtPct(r.ratio));
      return wrap;
    };
    tableWrap.replaceChildren(table(['자산군', '목표', '신규 약정', '달성률', '집행', '분배', '순현금흐름'],
      all.map(r => [r.name, fmt(r.target), fmt(r.commit), meterCell(r), fmt(r.call), fmt(r.dist), fmtSigned(r.dist - r.call)]),
      {
        totalLast: true,
        rowClass: (r, i) => (i < rows.length ? (rows[i].name === state.cls ? 'sel' : '') : (state.cls === ALL ? 'sel' : '')),
        onRow: (tr, r, i) => {
          const value = i < rows.length ? rows[i].name : ALL;
          tr.setAttribute('tabindex', '0'); tr.setAttribute('role', 'button');
          tr.setAttribute('aria-label', (value === ALL ? '전체 자산군' : value) + '으로 조회');
          const pick = () => { if (state.cls !== value) { state.cls = value; saveState(); renderAll(); } };
          tr.addEventListener('click', pick);
          tr.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
        },
      }));
    $('.sub', cardParts('byClass').card).textContent = yv + '년 ' + periodOf(yv) + ' 누적 · 단위 ' + UNIT + ' · 행을 누르면 해당 자산군으로 조회합니다';
  }

  // ---------- 렌더 파이프라인 ----------
  const charts = { yearly: renderYearly, cum: renderCum, flow: renderFlow };
  function renderAll() {
    renderHeader(); renderFilters(); renderKpis();
    for (const id in charts) charts[id]();
    renderByClass();
  }
  renderAll();

  // 폭이 바뀌면 해당 차트만 다시 그린다
  if ('ResizeObserver' in window) {
    let pending = null;
    const ro = new ResizeObserver(entries => {
      if (pending) return;
      pending = requestAnimationFrame(() => {
        pending = null;
        for (const e of entries) {
          const host = e.target, w = Math.round(host.clientWidth);
          if (host.hidden || w === +host.dataset.w) continue;
          host.dataset.w = w;
          const id = host.closest('[data-card]').dataset.card;
          if (charts[id]) charts[id]();
        }
      });
    });
    document.querySelectorAll('[data-card] .chart').forEach(h => { h.dataset.w = Math.round(h.clientWidth); ro.observe(h); });
  }
  window.addEventListener('scroll', hideTip, { passive: true });
})();
</script>
</body>
</html>
