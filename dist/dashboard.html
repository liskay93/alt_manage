<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>대체투자 약정 현황판</title>
<meta name="description" content="약정·집행·분배·순증 네 지표를 목표·현황·달성률 관점으로 보는 대체투자 대시보드">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --page:#f3f5f8; --surface:#ffffff; --surface-2:#f6f7fa;
  --ink:#161b23; --ink-2:#4b5563; --muted:#7a8494;
  --grid:#e6e9ee; --axis:#c9cfd8; --border:rgba(22,27,35,.10);
  --accent:#2a78d6;
  --s-commit:#2a78d6; --s-call:#eb6834; --s-dist:#1baf7a; --s-net:#eda100; --s-prev:#b3b9c3;
  --track:#b7d3f6;
  --good:#006300; --bad:#c62828;
  --tip-bg:#161b23; --tip-ink:#ffffff; --tip-muted:#aab2bf;
  --shadow:0 1px 2px rgba(22,27,35,.05),0 10px 24px -14px rgba(22,27,35,.18);
  --radius:12px;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#0e1116; --surface:#171b22; --surface-2:#1d222a;
    --ink:#f3f5f8; --ink-2:#b5bcc7; --muted:#848c98;
    --grid:#272c35; --axis:#3a404b; --border:rgba(255,255,255,.10);
    --accent:#3987e5;
    --s-commit:#3987e5; --s-call:#d95926; --s-dist:#199e70; --s-net:#c98500; --s-prev:#4b525d;
    --track:#184f95;
    --good:#0ca30c; --bad:#e66767;
    --tip-bg:#f3f5f8; --tip-ink:#161b23; --tip-muted:#5c6470;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 24px -14px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0e1116; --surface:#171b22; --surface-2:#1d222a;
  --ink:#f3f5f8; --ink-2:#b5bcc7; --muted:#848c98;
  --grid:#272c35; --axis:#3a404b; --border:rgba(255,255,255,.10);
  --accent:#3987e5;
  --s-commit:#3987e5; --s-call:#d95926; --s-dist:#199e70; --s-net:#c98500; --s-prev:#4b525d;
  --track:#184f95;
  --good:#0ca30c; --bad:#e66767;
  --tip-bg:#f3f5f8; --tip-ink:#161b23; --tip-muted:#5c6470;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 24px -14px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--page);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{max-width:1320px;margin-inline:auto;padding-block:28px 56px;padding-inline:clamp(16px,3vw,32px)}
.masthead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px;margin-bottom:18px}
.eyebrow{margin:0 0 4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{margin:0;font-size:clamp(20px,2.4vw,26px);font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.meta{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.filters{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;margin-bottom:22px}
.filter{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.filter-label{font-size:12px;font-weight:600;color:var(--muted)}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:2px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px}
.seg button,.tools button{appearance:none;border:0;background:transparent;color:var(--ink-2);font:inherit;font-size:13px;font-weight:500;padding:5px 11px;border-radius:7px;cursor:pointer;font-variant-numeric:tabular-nums;line-height:1.3}
.seg button:hover,.tools button:hover{color:var(--ink)}
.seg button[aria-pressed="true"],.tools button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.10)}
.seg button:focus-visible,.tools button:focus-visible,tr[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.period{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;margin:0 0 10px}
.period h2{margin:0;font-size:13px;font-weight:600;color:var(--ink-2)}
.period span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px 12px;display:flex;flex-direction:column;gap:5px;min-width:0}
.tile-label{font-size:12.5px;color:var(--ink-2);font-weight:600;display:flex;align-items:center;gap:7px}
.tile-label .key{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.tile-label .note{margin-left:auto;font-weight:500;color:var(--muted);font-size:11.5px}
.tile-value{font-size:26px;font-weight:600;line-height:1.1;letter-spacing:-.01em;white-space:nowrap}
.tile-value .unit{font-size:14px;color:var(--ink-2);font-weight:500;margin-left:2px}
.tile-value.neg{color:var(--bad)}
.tile-target{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tile-foot{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:8px;flex-wrap:wrap;line-height:1.4}
.tile-foot .rate{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
.delta{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)} .delta.flat{color:var(--ink-2)}
.meter{position:relative;height:6px;border-radius:3px;background:var(--track);overflow:hidden;flex:1 1 60px;min-width:40px}
.meter[data-c]{background:color-mix(in srgb,var(--mc) 24%,var(--surface))}
.meter i{display:block;height:100%;background:var(--mc,var(--s-commit));border-radius:3px}
.meter b{position:absolute;top:0;bottom:0;width:2px;background:var(--ink-2);margin-left:-1px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.card{margin:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px 14px;box-shadow:var(--shadow);min-width:0}
.span-6{grid-column:span 6}.span-12{grid-column:span 12}
@media (max-width:920px){.span-6{grid-column:span 12}}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.card-head h2{margin:0;font-size:15px;font-weight:600}
.card-head .sub{margin:2px 0 0;font-size:12px;color:var(--muted)}
.tools{display:inline-flex;gap:2px;padding:2px;background:var(--surface-2);border-radius:7px;border:1px solid var(--border);flex:none}
.tools button{padding:3px 9px;font-size:12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2);margin-bottom:8px}
.legend:empty{display:none}
.legend .item{display:inline-flex;align-items:center;gap:6px}
.legend .sw{width:12px;height:12px;border-radius:3px;flex:none}
.legend .sw.line{height:2.5px;width:14px;border-radius:1px}
.legend .sw.dot{width:9px;height:9px;border-radius:50%}
.legend .sw.dash{height:0;width:14px;border-top:1.5px dashed var(--muted);border-radius:0}
.chart{position:relative;min-width:0}
.panels{display:grid;gap:12px 20px}
.panel{min-width:0}
.panel-head{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:2px;font-variant-numeric:tabular-nums}
.panel-head .key{width:10px;height:10px;border-radius:3px;flex:none}
.panel-head .rate{margin-left:auto;color:var(--ink)}
.panel-head .rate small{font-weight:500;color:var(--muted);margin-right:4px}
.chart svg{display:block;width:100%;height:auto;font-family:var(--font);overflow:visible}
.chart text{fill:var(--ink-2);font-size:11px;font-variant-numeric:tabular-nums;pointer-events:none}
.chart path,.chart circle,.chart line{pointer-events:none}
.chart .tick{fill:var(--muted)}
.chart .gridline{stroke:var(--grid);stroke-width:1}
.chart .baseline{stroke:var(--axis);stroke-width:1}
.chart .crossline{stroke:var(--axis);stroke-width:1}
.chart .ref{stroke:var(--muted);stroke-dasharray:4 3;stroke-width:1}
.chart .hit{fill:transparent;cursor:pointer;outline:none;pointer-events:all}
.chart .hit.explore{cursor:crosshair}
.chart .hit:focus-visible{stroke:var(--accent);stroke-width:2}
.chart .bar-g:hover .mark,.chart .bar-g:focus-within .mark{filter:brightness(1.12)}
.chart .lbl{fill:var(--ink);font-weight:600;font-size:11.5px}
.chart .lbl.muted{fill:var(--muted);font-weight:500}
.chart .xlab{fill:var(--muted);text-anchor:middle}
.chart .xlab.sel{fill:var(--ink);font-weight:600}
.chart .xlab.sub{font-size:10px}
.chart .empty{fill:var(--muted);font-size:13px;text-anchor:middle}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--grid);white-space:nowrap;vertical-align:middle}
th{font-weight:600;color:var(--muted);font-size:12px}
th:first-child,td:first-child{text-align:left;padding-left:6px}
thead tr.group th{text-align:center;color:var(--ink-2);border-bottom:0;padding-bottom:2px}
thead tr.group th .key{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:1px}
th.sep,td.sep{border-left:1px solid var(--grid)}
tbody tr[tabindex]{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
tbody tr.sel td:first-child{font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
tr.total td{font-weight:600;border-top:1px solid var(--axis);border-bottom:0}
td .meter{display:inline-block;vertical-align:middle;width:44px;margin-right:7px}
td.neg,.delta.neg{color:var(--bad)}
td .lead{display:inline-flex;align-items:center;gap:7px;font-weight:600;color:var(--ink)}
td .lead .key{width:9px;height:9px;border-radius:2px;flex:none}
.flist{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.frow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(48px,0.9fr) auto;align-items:center;gap:10px;font-size:12.5px;padding:3px 6px;border-radius:6px;outline:none}
.frow:hover,.frow:focus-visible{background:var(--surface-2)}
.frow:focus-visible{box-shadow:0 0 0 2px var(--accent)}
.frow .fname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.frow .fname small{color:var(--muted);margin-left:5px;font-size:11px}
.frow .fbar{position:relative;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.frow .fbar i{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--mc)}
.frow .fbar b{position:absolute;top:0;bottom:0;width:1px;background:var(--axis)}
.frow .fval{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink);white-space:nowrap;text-align:right}
.frow .fval small{color:var(--muted);font-weight:500;margin-left:5px;display:inline-block;min-width:34px;text-align:right}
.frow.other .fname{color:var(--muted)} .frow.other .fbar i{background:var(--s-prev)} .frow.other .fval{color:var(--ink-2);font-weight:500}
.frow.neg .fval{color:var(--bad)}
.fempty{font-size:12.5px;color:var(--muted);padding:10px 6px}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
th.sortable[aria-sort="ascending"],th.sortable[aria-sort="descending"]{color:var(--ink)}
th.sortable:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tooltip{position:fixed;z-index:10;pointer-events:none;background:var(--tip-bg);color:var(--tip-ink);border-radius:8px;padding:8px 11px;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:300px;line-height:1.7}
.tooltip .t{color:var(--tip-muted);margin-bottom:2px;font-weight:600}
.tooltip .r{display:flex;align-items:center;gap:8px}
.tooltip .r .k{width:12px;height:3px;border-radius:2px;flex:none}
.tooltip .r .k.rect{height:10px;border-radius:2px}
.tooltip .r .k.dot{width:9px;height:9px;border-radius:50%}
.tooltip .r .k.dash{height:0;border-top:1.5px dashed var(--tip-muted);border-radius:0}
.tooltip .r .k.none{background:transparent}
.tooltip .r .n{color:var(--tip-muted)}
.tooltip .r .v{font-weight:600;font-variant-numeric:tabular-nums;margin-left:auto;padding-left:12px}
.tooltip .r.strong .n{color:var(--tip-ink)}
footer{margin-top:24px;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px}
.empty-page{padding:40px 0;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.tooltip{display:none}.card{box-shadow:none;break-inside:avoid}}
</style>
</head>

<div class="app" id="app">
  <header class="masthead">
    <div>
      <p class="eyebrow">대체투자 · 약정 관리</p>
      <h1>대체투자 약정 현황판</h1>
    </div>
    <div class="meta" id="meta"></div>

  <div class="filters" role="group" aria-label="조회 조건">

    <div class="filter"><span class="filter-label">자산군</span><div class="seg" id="classSeg" role="group" aria-label="자산군"></div></div>
  </div>

  <div class="period"><h2 id="periodTitle"></h2><span id="periodNote"></span></div>
  <section class="kpis" id="kpis" aria-label="지표별 목표·현황·달성률"></section>

  <section class="grid">
    <figure class="card span-12" data-card="yearly">
      <figcaption class="card-head">
        <div><h2>연도별 목표 대비 실적</h2><p class="sub">지표별로 연한 막대는 목표, 진한 막대는 실적(현황) · 막대를 누르면 기준연도가 바뀝니다</p></div>
        <div class="tools"><button type="button" data-view="chart" aria-pressed="true">차트</button><button type="button" data-view="table" aria-pressed="false">표</button></div>
      </figcaption>
      <div class="legend"></div>
      <div class="chart panels"></div>
      <div class="table-wrap" hidden></div>
    </figure>

    <figure class="card span-12" data-card="cum">
      <figcaption class="card-head">
        <div><h2>연중 누적 추이</h2><p class="sub">1월부터 누적한 실적(색 선)과 연간 목표(점선), 전년 누적 실적(회색) · 마우스를 올리면 네 지표가 같은 달에 맞춰집니다</p></div>
        <div class="tools"><button type="button" data-view="chart" aria-pressed="true">차트</button><button type="button" data-view="table" aria-pressed="false">표</button></div>
      </figcaption>
      <div class="legend"></div>
      <div class="chart panels"></div>
      <div class="table-wrap" hidden></div>
    </figure>

    <figure class="card span-12" data-card="funds">
      <figcaption class="card-head">
        <div><h2>누적 실적을 이끈 펀드</h2><p class="sub"></p></div>
        <div class="tools"><button type="button" data-view="chart" aria-pressed="true">상위 펀드</button><button type="button" data-view="table" aria-pressed="false">전체 표</button></div>
      </figcaption>
      <div class="chart panels"></div>
      <div class="table-wrap" hidden></div>
    </figure>

    <figure class="card span-6" data-card="summary">
      <figcaption class="card-head">
        <div><h2>지표별 요약</h2><p class="sub"></p></div>
      </figcaption>
      <div class="table-wrap"></div>
    </figure>

    <figure class="card span-6" data-card="flow">
      <figcaption class="card-head">
        <div><h2>월별 집행·분배·순증</h2><p class="sub">위는 집행(잔액 증가), 아래는 분배(잔액 감소), 점은 그 달의 순증</p></div>
        <div class="tools"><button type="button" data-view="chart" aria-pressed="true">차트</button><button type="button" data-view="table" aria-pressed="false">표</button></div>
      </figcaption>
      <div class="legend"></div>
      <div class="chart"></div>
      <div class="table-wrap" hidden></div>
    </figure>

    <figure class="card span-12" data-card="byClass">
      <figcaption class="card-head">
        <div><h2>자산군별 목표·현황·달성률</h2><p class="sub"></p></div>
      </figcaption>
      <div class="table-wrap"></div>
    </figure>
  </section>

  <footer id="foot"></footer>
</div>
<div class="tooltip" id="tooltip" role="tooltip" hidden></div>

  // ---------- 지표 타일: 목표 · 현황 · 달성률 ----------
  function deltaEl(cur, prev) {
    if (prev == null) return el('span', { class: 'delta flat', text: '전년 동기 자료 없음' });
    if (!prev) return el('span', { class: 'delta flat', text: cur ? '전년 동기 0' : '변동 없음' });
    const r = cur / Math.abs(prev) - Math.sign(prev), dir = r > 0.0005 ? 'up' : r < -0.0005 ? 'down' : 'flat';

  }
  function renderKpis() {

        el('div', { class: 'tile-foot' }, [meterEl(r, mt.color, pace), el('span', { class: 'rate', text: fmtPct(r) })]),
        el('div', { class: 'tile-foot' }, [deltaEl(actual, pv && pv[mt.key]), el('span', { text: '전년 동기 대비' })]),

  // ---------- 카드 공통 ----------
  function cardParts(id) { const card = $('[data-card="' + id + '"]'); return { card, chart: $('.chart', card), tableWrap: $('.table-wrap', card), legend: $('.legend', card), sub: $('.sub', card) }; }
  function applyView(id) {
    const { card, chart, tableWrap } = cardParts(id);
    const view = state.views[id] === 'table' ? 'table' : 'chart';
    if (chart) chart.hidden = view !== 'chart';

  }
  document.querySelectorAll('.tools button').forEach(b => b.addEventListener('click', () => {
    const id = b.closest('[data-card]').dataset.card;
    state.views[id] = b.dataset.view; saveState(); applyView(id);
  }));
  function panelGrid(host, cols) { host.style.gridTemplateColumns = 'repeat(' + cols + ', minmax(0, 1fr))'; }
  function metricGroups(first) { return [{ label: first, span: 1 }, ...METRICS.map(mt => ({ label: mt.label, span: 3, color: mt.color }))]; }
  function metricCols() { return METRICS.flatMap(() => ['목표', '현황', '달성률']); }
  function tripleCells(actual, target, color) { const r = ratio(actual, target); return [fmt(target), fmt(actual), rateCell(r, color)]; }
  function rateCell(r, color) { const w = el('span'); w.append(meterEl(r, color), fmtPct(r)); return w; }

  // ---------- 차트 1: 연도별 목표 대비 실적 (지표별 소형 차트) ----------
  function yearlyPanel(mt, rows, W) {
    const H = 210, m = { t: 24, r: 6, b: 34, l: 42 }, pw = W - m.l - m.r, ph = H - m.t - m.b;
    const sc = scaleFor(rows.flatMap(r => [r.tg[mt.tkey], r.st[mt.key]]), 3);
    const y = v => m.t + ((sc.hi - v) / (sc.hi - sc.lo)) * ph, y0 = y(0);
    const band = pw / rows.length, bw = Math.min(20, Math.max(6, band * 0.44));
    const s = svg('svg', { viewBox: '0 0 ' + W + ' ' + H, width: W, height: H, role: 'group', 'aria-label': mt.label + ' 연도별 목표 대비 실적' });
    for (const t of sc.ticks) {
      s.appendChild(svg('line', { x1: m.l, x2: W - m.r, y1: y(t), y2: y(t), class: t === 0 ? 'baseline' : 'gridline' }));
      s.appendChild(svg('text', { x: m.l - 6, y: y(t) + 4, 'text-anchor': 'end', class: 'tick' }, [fmt(t)]));
    }
    const track = 'color-mix(in srgb, ' + mt.color + ' 28%, var(--surface))';
    rows.forEach((r, i) => {
      const cx = m.l + band * (i + 0.5), x = cx - bw / 2, sel = r.year === state.year;
      const target = r.tg[mt.tkey], actual = r.st[mt.key], rt = ratio(actual, target);
      const partial = r.year === asOfY && r.months < 12;
      const g = svg('g', { class: 'bar-g' + (sel ? ' sel' : '') });
      const hit = svg('rect', { x: m.l + band * i, y: m.t - 16, width: band, height: ph + 16 + m.b - 4, class: 'hit', tabindex: 0, role: 'button', 'aria-pressed': String(sel), 'aria-label': r.year + '년 ' + mt.label + ' 목표 ' + fmtU(target) + ', 실적 ' + fmtU(actual) + ', 달성률 ' + fmtPct(rt) + '. 기준연도로 선택' });
      g.appendChild(hit);
      if (target) { const p = svg('path', { d: vbar(x, bw, target, y, y0), class: 'track' }); p.style.fill = track; g.appendChild(p); }
      if (actual) g.appendChild(svg('path', { d: vbar(x, bw, actual, y, y0), fill: mt.color, class: 'mark' }));
      const ext = Math.max(target || 0, actual || 0), low = Math.min(target || 0, actual || 0);

      if (labelText && (band >= 34 || sel)) {
        const above = ext > 0 || low === 0;
        s.appendChild(svg('text', { x: cx, y: above ? y(ext) - 6 : y(low) + 13, 'text-anchor': 'middle', class: 'lbl' + (rt == null ? ' muted' : '') }, [labelText]));
      }
      g.appendChild(svg('text', { x: cx, y: H - m.b + 16, class: 'xlab' + (sel ? ' sel' : '') }, [String(r.year)]));
      if (partial) g.appendChild(svg('text', { x: cx, y: H - m.b + 28, class: 'xlab sub' }, ['1~' + r.months + '월']));
      if (sel) g.appendChild(svg('rect', { x: cx - 12, y: H - m.b + (partial ? 31 : 20), width: 24, height: 2, rx: 1, fill: 'var(--accent)' }));
      const rowsTip = [
        { color: track, shape: 'rect', label: '목표', value: fmtU(target) },
        { color: mt.color, shape: 'rect', label: partial ? '실적 (1~' + r.months + '월)' : '실적', value: fmtU(actual) },
        { label: '달성률', value: fmtPct(rt), strong: true },
      ];
      const title = r.year + '년 ' + mt.label;
      hit.addEventListener('pointerenter', e => showTip(title, rowsTip, e.clientX, e.clientY));
      hit.addEventListener('pointermove', e => positionTip(e.clientX, e.clientY));
      hit.addEventListener('pointerleave', hideTip);
      hit.addEventListener('focus', () => { const p = svgPoint(s, W, H, cx, y(Math.max(ext, 0))); showTip(title, rowsTip, p[0], p[1]); });
      hit.addEventListener('blur', hideTip);
      const select = () => { if (state.year !== r.year) { state.year = r.year; saveState(); hideTip(); renderAll(); } };

  function renderYearly() {

  // ---------- 차트 2: 연중 누적 추이 (지표별 소형 차트, 크로스헤어 동기화) ----------
  function renderCum() {
    const { chart: host, tableWrap, legend } = cardParts('cum');
    const yv = state.year, cls = state.cls;
    const cur = cumulative(monthly(yv, cls));
    const hasPrev = yearsWithFlows.has(yv - 1);
    const prev = hasPrev ? cumulative(monthly(yv - 1, cls)) : null;
    const tg = targetsOf(yv, cls);
    legendInto(legend, [{ label: yv + '년 누적 실적 (지표 색)', shape: 'line', color: 'var(--ink-2)' }, hasPrev ? { label: (yv - 1) + '년 누적 실적', shape: 'line', color: 'var(--s-prev)' } : null, { label: '연간 목표', shape: 'dash' }].filter(Boolean));
    const W = Math.max(280, host.clientWidth || 1100), gap = 20;
    const cols = W >= 820 ? 2 : 1, pw = Math.floor((W - gap * (cols - 1)) / cols);
    panelGrid(host, cols);
    const panels = [];
    const hideAll = () => { for (const p of panels) p.cross.setAttribute('visibility', 'hidden'); hideTip(); active = -1; };
    let active = -1;
    function showAt(i, k, cx, cy) {
      active = i;
      for (const p of panels) {
        const v = p.vals[i], pv = p.pvals ? p.pvals[i] : null;
        p.cl.setAttribute('x1', p.x(i)); p.cl.setAttribute('x2', p.x(i));
        if (v == null) p.dot.setAttribute('visibility', 'hidden'); else { p.dot.removeAttribute('visibility'); p.dot.setAttribute('cx', p.x(i)); p.dot.setAttribute('cy', p.y(v)); }
        if (p.pdot) { if (pv == null) p.pdot.setAttribute('visibility', 'hidden'); else { p.pdot.removeAttribute('visibility'); p.pdot.setAttribute('cx', p.x(i)); p.pdot.setAttribute('cy', p.y(pv)); } }
        p.cross.removeAttribute('visibility');
      }
      const p = panels[k], v = p.vals[i], pv = p.pvals ? p.pvals[i] : null;
      const rows = [];
      if (v != null) rows.push({ color: p.mt.color, shape: 'line', label: '누적 실적', value: fmtU(v) });
      if (p.target) rows.push({ shape: 'dash', label: '연간 목표', value: fmtU(p.target) });
      if (v != null && p.target) rows.push({ label: '달성률', value: fmtPct(v / p.target), strong: true });
      if (pv != null) rows.push({ color: 'var(--s-prev)', shape: 'line', label: (yv - 1) + '년 동기 누적', value: fmtU(pv) });
      if (!rows.length) { hideAll(); return; }
      showTip(yv + '년 ' + (i + 1) + '월 · ' + p.mt.label, rows, cx, cy);
    }
    host.replaceChildren(...METRICS.map((mt, k) => {
      const vals = cur.map(v => v ? v[mt.key] : null), pvals = prev ? prev.map(v => v ? v[mt.key] : null) : null, target = tg[mt.tkey];
      const W1 = pw, H = 230, narrow = W1 < 460, m = { t: 14, r: narrow ? 58 : 84, b: 26, l: 44 }, ppw = W1 - m.l - m.r, ph = H - m.t - m.b;
      const all = [...vals.filter(v => v != null), ...(pvals ? pvals.filter(v => v != null) : []), target || 0];
      const sc = scaleFor(all, 3);
      const y = v => m.t + ((sc.hi - v) / (sc.hi - sc.lo)) * ph, x = i => m.l + (ppw / 11) * i;
      const s = svg('svg', { viewBox: '0 0 ' + W1 + ' ' + H, width: W1, height: H, role: 'group', 'aria-label': yv + '년 ' + mt.label + ' 누적 추이' });
      for (const t of sc.ticks) {
        s.appendChild(svg('line', { x1: m.l, x2: m.l + ppw, y1: y(t), y2: y(t), class: t === 0 ? 'baseline' : 'gridline' }));
        s.appendChild(svg('text', { x: m.l - 6, y: y(t) + 4, 'text-anchor': 'end', class: 'tick' }, [fmt(t)]));
      }
      for (let i = 0; i < 12; i++) { if (narrow && i % 2) continue; s.appendChild(svg('text', { x: x(i), y: H - m.b + 16, class: 'xlab' }, [(i + 1) + '월'])); }
      const labels = [];
      if (target) {
        s.appendChild(svg('line', { x1: m.l, x2: m.l + ppw, y1: y(target), y2: y(target), class: 'ref' }));
        labels.push({ y: y(target), py: y(target), px: m.l + ppw, text: (narrow ? '' : '목표 ') + fmt(target), cls: 'lbl muted' });
      }
      const line = (arr, color) => { let d = '', li = -1; arr.forEach((v, i) => { if (v == null) return; d += (li < 0 ? 'M' : 'L') + x(i).toFixed(1) + ',' + y(v).toFixed(1); li = i; }); if (li >= 0) s.appendChild(svg('path', { d, fill: 'none', stroke: color, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' })); return li; };
      if (pvals) line(pvals, 'var(--s-prev)');
      const li = line(vals, mt.color);
      if (li >= 0) {
        s.appendChild(svg('circle', { cx: x(li), cy: y(vals[li]), r: 4.5, fill: mt.color, stroke: 'var(--surface)', 'stroke-width': 2 }));
        labels.push({ y: y(vals[li]), py: y(vals[li]), px: x(li), text: fmt(vals[li]), cls: 'lbl' });
      } else if (!pvals) {
        s.appendChild(svg('text', { x: m.l + ppw / 2, y: m.t + ph / 2, class: 'empty' }, ['데이터 없음']));
      }
      resolveLabels(labels, 15, m.t + 4, m.t + ph);
      const lx = m.l + ppw + 9;
      for (const L of labels) {
        if (Math.abs(L.y - L.py) > 2 || L.px < m.l + ppw - 1) s.appendChild(svg('line', { x1: L.px + 6, y1: L.py, x2: lx - 3, y2: L.y, stroke: 'var(--axis)', 'stroke-width': 1 }));
        s.appendChild(svg('text', { x: lx, y: L.y + 4, class: L.cls }, [L.text]));
      }
      const cross = svg('g', { visibility: 'hidden' });
      const cl = svg('line', { y1: m.t, y2: m.t + ph, class: 'crossline' });
      const dot = svg('circle', { r: 4, fill: mt.color, stroke: 'var(--surface)', 'stroke-width': 2 });
      const pdot = pvals ? svg('circle', { r: 3.5, fill: 'var(--s-prev)', stroke: 'var(--surface)', 'stroke-width': 2 }) : null;
      cross.append(cl, ...(pdot ? [pdot] : []), dot);
      s.appendChild(cross);
      const overlay = svg('rect', { x: m.l, y: m.t, width: ppw, height: ph, class: 'hit explore', tabindex: 0, role: 'application', 'aria-label': mt.label + ' 월별 값 탐색. 좌우 화살표로 이동' });
      s.appendChild(overlay);
      const lastIdx = li;
      overlay.addEventListener('pointermove', e => {
        const r = s.getBoundingClientRect(), sx = (e.clientX - r.left) * (W1 / r.width);

      overlay.addEventListener('blur', hideAll);
      overlay.addEventListener('keydown', e => {
        if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
        e.preventDefault();
        let i = active < 0 ? Math.max(lastIdx, 0) : active + (e.key === 'ArrowRight' ? 1 : -1);
        i = Math.max(0, Math.min(11, i));
        const p = svgPoint(s, W1, H, x(i), m.t + 8); showAt(i, k, p[0], p[1]);
      });
      panels.push({ mt, vals, pvals, target, cross, cl, dot, pdot, x, y });
      const rt = li >= 0 ? ratio(vals[li], target) : null;
      return el('div', { class: 'panel' }, [
        el('div', { class: 'panel-head' }, [keySwatch(mt.color), el('span', { text: mt.label + ' 누적' }), el('span', { class: 'rate' }, [el('small', { text: '목표 대비' }), fmtPct(rt)])]),
        s,
      ]);
    }));
    tableWrap.replaceChildren(table(['월', ...METRICS.flatMap(() => ['누적 실적', '달성률'])],
      Array.from({ length: 12 }, (_, i) => [(i + 1) + '월', ...METRICS.flatMap(mt => { const v = cur[i] ? cur[i][mt.key] : null; return [fmt(v), v == null ? '–' : fmtPct(ratio(v, tg[mt.tkey]))]; })]),
      { groups: [{ label: '월', span: 1 }, ...METRICS.map(mt => ({ label: mt.label + ' (목표 ' + fmt(tg[mt.tkey]) + ')', span: 2, color: mt.color }))] }));
    applyView('cum');
  }

  // ---------- 표: 지표별 요약 ----------

  // ---------- 차트 3: 월별 집행·분배·순증 ----------
  function renderFlow() {
    const { chart: host, tableWrap, legend } = cardParts('flow');
    const yv = state.year, cls = state.cls, mon = monthly(yv, cls);
    const C = { call: METRICS[1], dist: METRICS[2], net: METRICS[3] };

    const W = Math.max(320, host.clientWidth || 600), H = 280, narrow = W < 520;
    const m = { t: 16, r: 12, b: 30, l: 48 }, pw = W - m.l - m.r, ph = H - m.t - m.b;
    const sc = scaleFor(mon.flatMap(v => v ? [v.call, -v.dist, v.net] : []), 3);
    const y = v => m.t + ((sc.hi - v) / (sc.hi - sc.lo)) * ph, y0 = y(0);
    const band = pw / 12, bw = Math.min(24, Math.max(6, band * 0.5));
    const s = svg('svg', { viewBox: '0 0 ' + W + ' ' + H, width: W, height: H, role: 'group', 'aria-label': yv + '년 월별 집행·분배·순증' });
    for (const t of sc.ticks) {
      s.appendChild(svg('line', { x1: m.l, x2: W - m.r, y1: y(t), y2: y(t), class: t === 0 ? 'baseline' : 'gridline' }));
      s.appendChild(svg('text', { x: m.l - 8, y: y(t) + 4, 'text-anchor': 'end', class: 'tick' }, [fmt(t)]));
    }
    if (!mon.some(Boolean)) s.appendChild(svg('text', { x: m.l + pw / 2, y: m.t + ph / 2, class: 'empty' }, ['해당 기간 데이터가 없습니다']));
    const dotsLayer = svg('g');
    mon.forEach((v, i) => {
      const cx = m.l + band * (i + 0.5), x = cx - bw / 2;
      if (!narrow || i % 2 === 0) s.appendChild(svg('text', { x: cx, y: H - m.b + 18, class: 'xlab' }, [(i + 1) + '월']));
      if (!v) return;
      const g = svg('g', { class: 'bar-g' });
      const title = yv + '년 ' + (i + 1) + '월';
      const hit = svg('rect', { x: m.l + band * i, y: m.t, width: band, height: ph, class: 'hit', tabindex: 0, 'aria-label': title + ' 집행 ' + fmtU(v.call) + ', 분배 ' + fmtU(v.dist) + ', 순증 ' + fmtU(v.net) });
      g.appendChild(hit);
      if (v.call > 0) g.appendChild(svg('path', { d: barPath(x, y(v.call), bw, y0 - 1 - y(v.call), 4, 'up'), fill: C.call.color, class: 'mark' }));
      if (v.dist > 0) g.appendChild(svg('path', { d: barPath(x, y0 + 1, bw, y(-v.dist) - y0 - 1, 4, 'down'), fill: C.dist.color, class: 'mark' }));
      dotsLayer.appendChild(svg('circle', { cx, cy: y(v.net), r: 4, fill: C.net.color, stroke: 'var(--surface)', 'stroke-width': 2 }));
      const rows = [
        { color: C.call.color, shape: 'rect', label: '집행', value: '+' + fmt(v.call) + U },
        { color: C.dist.color, shape: 'rect', label: '분배', value: '−' + fmt(v.dist) + U },
        { color: C.net.color, shape: 'dot', label: '순증', value: fmtSigned(v.net) + U, strong: true },
      ];
      hit.addEventListener('pointerenter', e => showTip(title, rows, e.clientX, e.clientY));
      hit.addEventListener('pointermove', e => positionTip(e.clientX, e.clientY));
      hit.addEventListener('pointerleave', hideTip);
      hit.addEventListener('focus', () => { const p = svgPoint(s, W, H, cx, y(v.call)); showTip(title, rows, p[0], p[1]); });
      hit.addEventListener('blur', hideTip);
      s.appendChild(g);
    });
    s.appendChild(dotsLayer);
    host.replaceChildren(s);
    const tRows = mon.map((v, i) => [(i + 1) + '월', v ? fmt(v.call) : '–', v ? fmt(v.dist) : '–', v ? fmt(v.net) : '–']);
    const tot = mon.reduce((a, v) => v ? { c: a.c + v.call, d: a.d + v.dist } : a, { c: 0, d: 0 });
    tRows.push(['합계', fmt(tot.c), fmt(tot.d), fmt(tot.c - tot.d)]);
    tableWrap.replaceChildren(table(['월', '집행 (' + U + ')', '분배 (' + U + ')', '순증 (' + U + ')'], tRows, { totalLast: true }));
    applyView('flow');
  }

  // ---------- 표: 자산군별 목표·현황·달성률 ----------
  function renderByClass() {
    const { tableWrap, sub } = cardParts('byClass');
    const yv = state.year;
    const rows = CLASSES.map(c => ({ name: c, st: status(yv, c), tg: targetsOf(yv, c) }));
    rows.push({ name: '합계', st: status(yv, ALL), tg: targetsOf(yv, ALL) });
    sub.textContent = yv + '년 ' + periodOf(yv) + ' 누적 · 단위 ' + UNIT + ' · 행을 누르면 해당 자산군으로 조회합니다';
    tableWrap.replaceChildren(table(['자산군', ...metricCols()],
      rows.map(r => [r.name, ...METRICS.flatMap(mt => tripleCells(r.st[mt.key], r.tg[mt.tkey], mt.color))]),
      {
        groups: metricGroups('자산군'),
        totalLast: true,
        rowClass: (r, i) => { const v = i < CLASSES.length ? CLASSES[i] : ALL; return v === state.cls ? 'sel' : ''; },
        onRow: (tr, r, i) => {
          const value = i < CLASSES.length ? CLASSES[i] : ALL;
          tr.setAttribute('tabindex', '0'); tr.setAttribute('role', 'button');
          tr.setAttribute('aria-label', (value === ALL ? '전체 자산군' : value) + '으로 조회');
          const pick = () => { if (state.cls !== value) { state.cls = value; saveState(); renderAll(); } };
          tr.addEventListener('click', pick);
          tr.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
        },
      }));
  }

  // ---------- 펀드별 집계 ----------
  // 기준연도에 실적이 있는 펀드 목록. 당해 값과 그 연도까지의 누적(약정·집행·분배)을 함께 계산한다.
  function fundsFor(year, cls) {
    const map = new Map();
    for (const f of FUNDS) {
      if (cls !== ALL && f.assetClass !== cls) continue;
      if (+f.year > year) continue;
      const id = f.fund + '|' + f.assetClass;
      let o = map.get(id);
      if (!o) { o = { fund: f.fund, assetClass: f.assetClass, vintage: +f.vintage || +f.year, commit: 0, call: 0, dist: 0, net: 0, lifeCommit: 0, lifeCall: 0, lifeDist: 0 }; map.set(id, o); }
      const c = +f.commitment || 0, d = +f.drawdown || 0, r = +f.distribution || 0;
      o.lifeCommit += c; o.lifeCall += d; o.lifeDist += r;
      if (+f.year === year) { o.commit += c; o.call += d; o.dist += r; }
    }
    const out = [];
    for (const o of map.values()) { o.net = o.call - o.dist; o.callRate = ratio(o.lifeCall, o.lifeCommit); if (o.commit || o.call || o.dist) out.push(o); }
    return out;
  }
  function fundTipRows(f) {
    return [
      ...METRICS.map(mt => ({ color: mt.color, shape: 'rect', label: mt.label, value: fmtU(f[mt.key]) })),
      { label: '누적 약정 ' + fmtU(f.lifeCommit) + ' 중 집행률', value: fmtPct(f.callRate), strong: true },
    ];
  }
  function fundRow(o) {
    const bar = el('span', { class: 'fbar', 'aria-hidden': 'true' });
    const i = el('i'); i.style.background = o.color;
    if (o.diverging) {
      const z = el('b'); z.style.left = '50%'; bar.appendChild(z);
      i.style.width = (Math.abs(o.value) / o.maxAbs * 50) + '%';
      if (o.value >= 0) i.style.left = '50%'; else i.style.right = '50%';
    } else { i.style.left = '0'; i.style.width = (Math.abs(o.value) / o.maxAbs * 100) + '%'; }
    bar.appendChild(i);
    const row = el('div', { class: 'frow' + (o.other ? ' other' : '') + (o.value < 0 ? ' neg' : ''), tabindex: '0', role: 'img', 'aria-label': o.name + (o.tag ? ' (' + o.tag + ')' : '') + ' ' + fmtU(o.value) + (o.share ? ', 비중 ' + o.share : '') }, [
      el('span', { class: 'fname', title: o.name }, [o.name, o.tag ? el('small', { text: o.tag }) : null]),
      bar,
      el('span', { class: 'fval' }, [fmt(o.value), el('small', { text: o.share || '' })]),
    ]);
    if (o.tip) {
      const show = (x, y) => showTip(o.tip.title, o.tip.rows, x, y);
      row.addEventListener('pointerenter', e => show(e.clientX, e.clientY));
      row.addEventListener('pointermove', e => positionTip(e.clientX, e.clientY));
      row.addEventListener('pointerleave', hideTip);
      row.addEventListener('focus', () => { const b = row.getBoundingClientRect(); show(b.left + b.width * 0.4, b.top + b.height / 2); });
      row.addEventListener('blur', hideTip);
    }
    return row;
  }
  function renderFunds() {
    const { chart: host, tableWrap, sub } = cardParts('funds');
    const yv = state.year, cls = state.cls, TOP = 5;
    const funds = fundsFor(yv, cls), st = status(yv, cls);
    sub.textContent = yv + '년 ' + periodOf(yv) + ' 누적 기준 · 지표별 상위 ' + TOP + '개 펀드와 전체 대비 비중 · 순증은 잔액을 늘린 펀드가 오른쪽, 줄인 펀드가 왼쪽';
    const W = Math.max(280, host.clientWidth || 1100);
    const ncols = W >= 1180 ? 4 : W >= 560 ? 2 : 1;
    panelGrid(host, ncols);
    host.replaceChildren(...METRICS.map(mt => {
      const key = mt.key, total = st[key];
      const list = funds.filter(f => f[key]).sort((a, b) => Math.abs(b[key]) - Math.abs(a[key]));
      const top = list.slice(0, TOP), rest = list.slice(TOP);
      const restSum = rest.reduce((a, f) => a + f[key], 0), topSum = top.reduce((a, f) => a + f[key], 0);
      const maxAbs = Math.max(1, ...top.map(f => Math.abs(f[key])), Math.abs(restSum));
      const diverging = key === 'net' && (list.some(f => f[key] < 0) || restSum < 0);
      const share = v => total > 0 ? fmtPct(v / total) : null;
      const head = el('div', { class: 'panel-head' }, [keySwatch(mt.color), el('span', { text: mt.label + ' 상위 ' + top.length + '개' }), el('span', { class: 'rate' }, [el('small', { text: '상위 비중' }), share(topSum) || '–'])]);
      const body = el('div', { class: 'flist' });
      if (!list.length) body.appendChild(el('div', { class: 'fempty', text: '해당 기간 ' + mt.label + ' 실적이 있는 펀드가 없습니다' }));
      for (const f of top) body.appendChild(fundRow({ name: f.fund, tag: ncols > 2 ? '' : (cls === ALL ? f.assetClass : f.vintage + '년 약정'), value: f[key], maxAbs, diverging, color: mt.color, share: share(f[key]), tip: { title: f.fund + ' · ' + f.assetClass + ' · ' + f.vintage + '년 약정 · ' + yv + '년 ' + periodOf(yv), rows: fundTipRows(f) } }));
      if (rest.length) body.appendChild(fundRow({ name: '기타 ' + rest.length + '개 펀드', value: restSum, maxAbs, diverging, share: share(restSum), other: true }));
      return el('div', { class: 'panel' }, [head, body]);
    }));
    // 전체 표: 열 머리글을 누르면 정렬
    const cols = [
      { label: '펀드', key: 'fund', str: true }, { label: '자산군', key: 'assetClass', str: true }, { label: '약정연도', key: 'vintage' },
      ...METRICS.map(mt => ({ label: mt.label, key: mt.key, color: mt.color })),
      { label: '누적 약정', key: 'lifeCommit' }, { label: '누적 집행률', key: 'callRate' },
    ];
    const sort = state.fundSort;
    const sorted = funds.slice().sort((a, b) => {
      const va = a[sort.key], vb = b[sort.key];
      if (typeof va === 'string' || typeof vb === 'string') return String(va).localeCompare(String(vb), 'ko') * sort.dir;
      return ((va == null ? -Infinity : va) - (vb == null ? -Infinity : vb)) * sort.dir;
    });
    const t = table(cols.map(c => c.label + (c.key === sort.key ? (sort.dir < 0 ? ' ▼' : ' ▲') : '')),
      sorted.map(f => [f.fund, f.assetClass, f.vintage + '년', ...METRICS.map(mt => fmt(f[mt.key])), fmt(f.lifeCommit), fmtPct(f.callRate)]));
    t.querySelectorAll('thead tr:last-child th').forEach((th, i) => {
      const c = cols[i];
      th.classList.add('sortable'); th.setAttribute('tabindex', '0'); th.setAttribute('role', 'button');
      th.setAttribute('aria-sort', c.key === sort.key ? (sort.dir < 0 ? 'descending' : 'ascending') : 'none');
      if (c.color) th.prepend(keySwatch(c.color));
      const pick = () => { state.fundSort = { key: c.key, dir: c.key === sort.key ? -sort.dir : (c.str ? 1 : -1) }; saveState(); renderFunds(); };
      th.addEventListener('click', pick);
      th.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
    });
    if (!funds.length) t.querySelector('tbody').appendChild(el('tr', null, [el('td', { colspan: String(cols.length), class: 'fempty', text: '해당 기간 실적이 있는 펀드가 없습니다' })]));
    tableWrap.replaceChildren(t);
    applyView('funds');
  }

  // ---------- 렌더 파이프라인 ----------
  const charts = { yearly: renderYearly, cum: renderCum, funds: renderFunds, flow: renderFlow };
  function renderAll() {
    renderHeader(); renderFilters(); renderKpis();
    for (const id in charts) charts[id]();
    renderSummary(); renderByClass();
  }
  renderAll();

  if ('ResizeObserver' in window) {
    let pending = null;
    const ro = new ResizeObserver(entries => {
      if (pending) return;
      pending = requestAnimationFrame(() => {
        pending = null;
        for (const e of entries) {
          const host = e.target, w = Math.round(host.clientWidth);
          if (host.hidden || w === +host.dataset.w) continue;
          host.dataset.w = w;
          const id = host.closest('[data-card]').dataset.card;
          if (charts[id]) charts[id]();
        }
      });
    });
    document.querySelectorAll('[data-card] .chart').forEach(h => { h.dataset.w = Math.round(h.clientWidth); ro.observe(h); });
  }
  window.addEventListener('scroll', hideTip, { passive: true });
})();
</script>
</body>
</html>
